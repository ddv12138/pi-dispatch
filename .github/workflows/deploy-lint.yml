# Syntax lint for the deploy/ daemon artifacts.
#
# These files are hand-written examples an operator adapts; nothing exercises them in the normal test
# suite (deploy/** is not in any other workflow's path filter), so a typo'd directive or a malformed
# plist ships silently and only fails on the operator's box. This workflow is the cheap gate: it checks
# STRUCTURE, not runtime behaviour.
#
#   - worker.service / receiver.service / console.service : `systemd-analyze verify` parses the units. The PLACEHOLDER
#     paths (/opt/pi-dispatch, /usr/bin/node) do not exist on the runner, so path-existence warnings are
#     EXPECTED and ignored; only genuine syntax errors (unknown directives, parse failures) fail.
#   - com.pi-dispatch.worker.plist : `xmllint --noout` proves the plist is well-formed XML. plutil is
#     macOS-only, so xmllint (libxml2-utils) is the Linux stand-in for well-formedness.
#   - worker-env-wrapper.sh : `sh -n` is a POSIX shell parse check (no execution).
#
# The `.cmd` wrappers (worker-env-wrapper.cmd, nssm-install.cmd) have no practical Linux linter and are
# not checked here -- deliberately, rather than with a flaky approximation.

name: deploy lint

on:
  # MAIN ONLY, for the reason `pi-upgrade-check.yml` records at greater length: without a `branches:` key
  # this fired on every branch, so a PR branch touching `deploy/` ran twice and produced two check runs
  # under one context name. This check is deliberately NOT required, so the duplicate could not deadlock a
  # merge -- but it could still show green twice while one of them was red.
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "worker/src/service.mjs"
      - ".github/workflows/deploy-lint.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "worker/src/service.mjs"
      - ".github/workflows/deploy-lint.yml"
  workflow_dispatch:

# Superseded runs are cancelled rather than queued. Same reasoning as `pi-upgrade-check.yml`: a literal
# group would serialise every PR against every other, and nothing here is a publish that must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: deploy/ artifacts are syntactically valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: systemd units parse (syntax only; PLACEHOLDER path warnings ignored)
        run: |
          # verify exits non-zero for the missing PLACEHOLDER exec paths, which is expected -- so gate on
          # the CONTENT of the diagnostics, not the exit code. A real defect is an unknown directive or a
          # parse failure; a missing /opt/pi-dispatch or /usr/bin/node is not.
          systemd-analyze verify --no-pager deploy/worker.service deploy/receiver.service deploy/console.service > verify.log 2>&1 || true
          cat verify.log
          if grep -Eiq 'Unknown (key name|lvalue|section)|Failed to parse|Invalid setting|not a valid|expected ' verify.log; then
            echo "::error::systemd-analyze found a syntax error in a unit file. See the log above."
            exit 1
          fi
          echo "OK: unit files are syntactically valid (path-existence warnings ignored)"

      # node and the workspace deps the render steps below need: `service render` resolves the worker's own
      # modules (BullMQ and friends), and the console render builds admin/dist first (esbuild).
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - run: npm ci --no-audit --no-fund

      # Issue #708: the console's unit as `service install --console` renders it: the whole ExecStart replaced by the
      # console package's entry with `serve --deployment`, which the template alone cannot show. The admin package is
      # built first, since its dist/console.mjs is the entry the render resolves (and refuses without).
      - name: a rendered console unit parses (issue #708)
        run: |
          node admin/build.mjs
          d="$RUNNER_TEMP/render-708"
          mkdir -p "$d"
          : > "$d/.env"
          (cd "$d" && node "$GITHUB_WORKSPACE/worker/src/cli.mjs" service render --console) > "$d/pi-dispatch-console.service"
          cat "$d/pi-dispatch-console.service"
          grep -Eq "^ExecStart=/[^ ]*node $GITHUB_WORKSPACE/admin/dist/console\.mjs serve --deployment $d\$" "$d/pi-dispatch-console.service" || { echo "::error::the rendered console unit does not run the console package's entry with serve --deployment"; exit 1; }
          grep -qx 'RestartPreventExitStatus=2' "$d/pi-dispatch-console.service" || { echo "::error::the rendered console unit lost RestartPreventExitStatus=2"; exit 1; }
          # And one folder holding characters a unit must quote or escape (a space, a quote, % and $), so the quoting
          # (`systemdWord`, `%%` in WorkingDirectory=) is parsed by systemd itself, not only by the unit tests' reader.
          q="$RUNNER_TEMP/it's 100% \$HOME"
          mkdir -p "$q" "$d/quoted"
          (cd "$q" && node "$GITHUB_WORKSPACE/worker/src/cli.mjs" service render --console) > "$d/quoted/pi-dispatch-console.service"
          grep -q '^WorkingDirectory=.*100%% \$HOME$' "$d/quoted/pi-dispatch-console.service" || { echo "::error::the quoted folder's % is not doubled in WorkingDirectory="; exit 1; }
          cat "$d/quoted/pi-dispatch-console.service"
          systemd-analyze verify --no-pager "$d/pi-dispatch-console.service" "$d/quoted/pi-dispatch-console.service" > verify-708.log 2>&1 || true
          cat verify-708.log
          if grep -Eiq 'Unknown (key name|lvalue|section)|Failed to parse|Invalid setting|not a valid|expected ' verify-708.log; then
            echo "::error::systemd-analyze found a syntax error in the rendered console unit. See the log above."
            exit 1
          fi
          echo "OK: the rendered console unit is syntactically valid"

      - name: plist is well-formed XML
        run: |
          xmllint --noout deploy/com.pi-dispatch.worker.plist \
            || { echo "::error::deploy/com.pi-dispatch.worker.plist is not well-formed XML."; exit 1; }
          echo "OK: plist well-formed"

      - name: POSIX wrapper parses
        run: |
          sh -n deploy/worker-env-wrapper.sh \
            || { echo "::error::deploy/worker-env-wrapper.sh has a shell syntax error."; exit 1; }
          echo "OK: worker-env-wrapper.sh parses"
