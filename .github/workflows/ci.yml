# CI for the test suite -- an independent signal on every push to main, every pull request and every
# `v*` tag. The control-plane IMAGE builds live in .github/workflows/images.yml and run in PARALLEL
# with this workflow, deliberately NOT gated by it: the suite is long and has a documented hang
# history (issue #657), while an image push on its own is harmless -- a deployment updates only by an
# explicit `docker compose pull`, the operator can read this workflow's status before pulling, and
# every build also lands an immutable `sha-<sha>` tag to pin or roll back to (docs/253-deployment.md).
#
# The posture is the repo's own known-good CI config (3ba40127~1, pi-upgrade-check.yml): a REAL Valkey
# backs the integration tests -- a skipped assertion is an UNVERIFIED assertion, so the
# PI_DISPATCH_REQUIRE_*_TESTS variables turn a skip into a hard failure, and VALKEY_TEST_URL is the
# service the integration tests dial. The suite reads ONE service: the worker/receiver/admin
# integration tests isolate themselves on separate database numbers of the same URL. Sixty minutes
# bounds the job (issue #657: a hung test once held one for five hours under the default cap).
#
# WHY PORT 6399, NOT 6379. Part of the suite dials redis://127.0.0.1:6399 with NO env gate at all:
# worker/test/cli.test.mjs hardcodes VALKEY_URL: "redis://127.0.0.1:6399", and start-wiring.test.mjs
# falls back to the same literal -- whose own comment (lines 27-41) predicts this exact trap: "A
# hardcoded local port therefore passes on a laptop that happens to run one there and wedges CI".
# A worker pointed at an unreachable Valkey does not fail fast: the boot health gate throws a
# retryable error (worker/src/valkey-endpoint.mjs) and the CLI retries every 2 seconds forever. The
# first CI run of this workflow hung 52 minutes doing exactly that -- "nothing answers VALKEY_URL
# (127.0.0.1:6399)" every 2 seconds -- because the service sat on 6379. So the service container
# PUBLISHES on 127.0.0.1:6399 (mapped from its own 6379) and VALKEY_TEST_URL points at the same
# container: the gated tests read the env, the hardcoded tests hit the literal, and both land on a
# healthy Valkey. The suite is also run with the env armed locally before every workflow change --
# a laptop that happens to run a Valkey on 6399 can no longer mask this, because the hardcoded
# tests now always find the CI container there too.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One ref, one live test run: a rapid second push to main cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # A real Valkey backs the queue integration tests. AOF is not needed for a test run; the point
      # is a genuine Redis-protocol server, not the fake. Every Valkey image name in this file is
      # VALKEY_IMAGE (worker/src/valkey-auth.mjs), held to it by worker/test/valkey-image.test.mjs.
      valkey:
        image: valkey/valkey:8.1
        ports:
          # Published on 6399, NOT the container's own 6379: the reason is the comment at the top of
          # this file -- the hardcoded redis://127.0.0.1:6399 tests must land on this container too.
          - 127.0.0.1:6399:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          PI_DISPATCH_REQUIRE_LOADER_TESTS: "1"
          PI_DISPATCH_REQUIRE_WORKER_TESTS: "1"
          PI_DISPATCH_REQUIRE_RECEIVER_TESTS: "1"
          VALKEY_TEST_URL: "redis://127.0.0.1:6399"
