# CI for the control-plane images. Two jobs:
#
#   test   -- the full npm test suite, on every push and every pull request. The images job below
#             refuses to build from anything the tests did not pass on.
#   images -- build and push the two control-plane images to Docker Hub, on push to main and on a
#             `v*` release tag only. PRs never see the registry credentials and never push.
#
# WHAT IS BUILT HERE AND WHAT IS NOT. Built: docker.io/ddv12138/pi-dispatch-worker (the compose
# worker AND console run it) from deploy/worker.Dockerfile, and docker.io/ddv12138/pi-dispatch-receiver
# from receiver/Dockerfile. Tag rules are set once at job level and shared by both images --
# `latest` follows every build (main and release tags), `sha-<sha>` names a main build and never
# moves (the rollback point a deployment pins), and a `v*` git tag adds its `<version>` number.
# NOT built here: the job images ddv12138/pi-job and pi-job-java21. They still come off the
# maintainer's machine via image/publish.sh -- released version tags there never move, and the
# Java image bakes one deployment's Maven network settings in -- see that script's header.
#
# The 253 deployment updates itself with `docker compose pull` + `up -d` against the `latest`
# these pushes move; docs/253-deployment.md holds the procedure and the rollback steps.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One ref, one live run: a rapid second push to main cancels the first run's in-progress build
# instead of queueing two registry pushes racing for the same `latest` tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  images:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Shared tag rules for both metadata steps below. `latest` is unconditional; the sha tag is
      # a main-branch fact; the semver tag only exists when the ref is a v* release tag.
      IMAGE_TAGS: |
        type=raw,value=latest
        type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
        type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # One metadata step PER IMAGE, deliberately: with several images on one step the action's
      # outputs mix the names, and a build-push step would push one image under both repositories.
      - id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: docker.io/ddv12138/pi-dispatch-worker
          tags: ${{ env.IMAGE_TAGS }}
      - id: meta-receiver
        uses: docker/metadata-action@v5
        with:
          images: docker.io/ddv12138/pi-dispatch-receiver
          tags: ${{ env.IMAGE_TAGS }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: receiver/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-receiver.outputs.tags }}
          labels: ${{ steps.meta-receiver.outputs.labels }}
          cache-from: type=gha,scope=receiver
          cache-to: type=gha,scope=receiver,mode=max
