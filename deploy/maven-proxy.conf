# Maven 依赖缓存代理（NGINX）的规则。随 pi-dispatch 发布，操作员不需要编辑本文件。
#
# 这个容器是干什么的。Java job 的 Maven 依赖不再烘焙进镜像（4.3.7 起 run.image 回归标准
# pi-job-java21），改从本容器拉：公开依赖代理 maven.aliyun.com 并缓存在 maven-cache 卷里（第一个
# job 拉一次，之后的 job 复用），私有构件（com/sscloud 一族）由操作员放进宿主机的
# /root/pi-dispatch/maven-repo/hosted/，从下面的 hosted location 只读服务。补包流程见
# docs/253-deployment.md。
#
# 为什么是明文 HTTP、为什么必须监听 80 端口。job 容器跑在 worker 为每个 job 创建的 --internal
# 网络里，唯一邻居是 squid 出口代理（deploy/egress-proxy.conf）。那份规则只放行两类流量：列名
# 主机的 CONNECT 443，和列名主机的明文 HTTP——而明文 HTTP 只在 80 端口放行（Safe_ports 只列了
# 80，`http_access allow allowed` 对 CONNECT 之外的请求只认这一个端口）。所以 job 到本容器的
# 这一跳必须是 80 端口明文 HTTP，整个链条是：
#
#   job --(http:80)--> pi-dispatch-maven-proxy --(CONNECT 443)--> squid --> maven.aliyun.com
#
# 本容器自己也没有直达外网的路由（它只在 egress-out 上），它对 aliyun 的上游连接同样要过
# squid，这正是白名单里 maven.aliyun.com（CONNECT 443）存在的原因之一。egress-allowlist.conf
# 里必须列 pi-dispatch-maven-proxy 这个名字，job 的 80 端口明文请求才放得进来。
#
# 为什么 hosted 卷是 :ro。容器只负责"服务"这些文件，不持有对它们的写权限：一个容器内进程能改写
# 被服务出去的构件，等于把私有依赖的供应链交给容器里跑的工单代码。操作员从宿主机侧 cp 进
# hosted 目录，目录改动即时生效（nginx 只是按路径 open 文件），无需重启容器。
#
# 为什么 proxy_pass 是静态主机名而不是 resolver+变量。nginx 启动时解析一次 maven.aliyun.com；
# DNS 失败会让 nginx 直接起不来，compose 的 healthcheck（wget 状态行）随之报 unhealthy，失败是
# 显式的。换来的是上游固定、日志可读。宿主 DNS 长期失联时再考虑换 resolver 形式。

# 缓存区。keys_zone 20m 足够容纳约十几万个 key；max_size 4g 是这台部署（82% 磁盘）的量级约束，
# inactive 60d：一个工件六周没人拉才淘汰——工单节奏下等于不过期，但给磁盘回收留了自动出口。
# use_temp_path=off：响应直接写进缓存目录，省一次同盘 rename，也避开 nginx 对临时目录的另一次
# 属主/权限纠结。
proxy_cache_path /var/cache/nginx/maven levels=1:2 keys_zone=maven:20m max_size=4g inactive=60d use_temp_path=off;

server {
    # 明文 HTTP 80，default_server：job 的 settings.xml 里 mirror URL 是 http://pi-dispatch-maven-proxy
    # （无端口即 80）。这个容器不发布任何宿主端口，80 只在容器网络内可达。
    listen 80 default_server;

    # 私有构件树，只读服务。hosted 目录里就是 com/sscloud/... 的原始目录树，try_files 按 URI 直取
    # 文件，缺了就 404——404 文本就是 Maven 报 Could not resolve 时操作员要看的信号（去补包）。
    # ^~ 前缀匹配并短路正则：没有它，下面 /maven-metadata 的正则会优先于这条前缀规则，
    # 把 hosted 树里的 metadata 请求劫持到 aliyun 上——私有族的 metadata 只存在于本机目录里。
    location ^~ /com/sscloud/ {
        root /data/hosted;
        try_files $uri =404;
    }

    # maven-metadata.xml：SNAPSHOT 解析每次构建都要读，且上游会变，所以代理但只缓存 10 分钟——
    # 同一工单里的重复解析命中缓存，跨工单又能 fairly 快地看到上游更新。
    # proxy_cache_key 是 $request_uri：同一个 GAV 路径全局一份缓存条目。
    #
    # 为什么这里的 proxy_pass 和下面的 location / 不一样：nginx 禁止正则 location 里的 proxy_pass 带
    # URI 部分（"cannot have URI part in location given by regular expression"，实测启动即崩，循环
    # 重启）。变量形式是正则 location 里表达同一映射的办法：上游前缀 /repository/public/ 后直接拼
    # $uri（解码后的规范化路径）再附回查询串，与 location / 的尾斜杠映射语义相同。
    location ~* /maven-metadata.*\.xml$ {
        proxy_pass https://maven.aliyun.com/repository/public$uri$is_args$args;
        proxy_set_header Host maven.aliyun.com;
        proxy_ssl_server_name on;
        proxy_cache maven;
        proxy_cache_lock on;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 10m;
    }

    # 其余一切（POM/JAR/插件）：代理并缓存 30 天。Maven 的版本化路径内容不变，长缓存就是
    # "第一个 job 拉一次，后续复用"的实现。404 缓存 10 分钟：挡住对不存在工件的重复回源，
    # 也不至于把"刚补进 hosted 前的失败"钉死（那是 hosted 404，不走这里）。
    location / {
        proxy_pass https://maven.aliyun.com/repository/public/;
        proxy_set_header Host maven.aliyun.com;
        proxy_ssl_server_name on;
        proxy_cache maven;
        proxy_cache_lock on;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10m;
    }
}
